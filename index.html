<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Nikolai Jump Agency - Dashboard</title>
    <style>
        :root {
            --bg-dark: #0f0f0f;
            --card-bg: #1a1a1a;
            --accent-blue: #00a8ff;
            --text-main: #f0f0f0;
            --status-green: #27ae60;
            --status-red: #c0392b;
            --border-color: #2d2d2d;
            --result-bg: #1e2a24;
            --calc-highlight: #a8e6cf;
        }

        body {
            font-family: 'Inter', 'Segoe UI', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
            border-bottom: 2px solid var(--accent-blue);
            padding-bottom: 10px;
            width: 100%;
            max-width: 1100px;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
            gap: 25px;
            width: 100%;
            max-width: 1100px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        h3 { margin-top: 0; color: var(--accent-blue); text-transform: uppercase; font-size: 0.85rem; letter-spacing: 1.5px; margin-bottom: 20px; }

        /* Producer Status */
        .producer-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 0;
            border-bottom: 1px solid #333;
        }

        .status-btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 700;
            transition: all 0.3s ease;
            width: 130px;
            text-transform: uppercase;
            color: white;
        }

        .available { background-color: var(--status-green); box-shadow: 0 0 15px rgba(39, 174, 96, 0.2); }
        .unavailable { background-color: var(--status-red); box-shadow: 0 0 15px rgba(192, 57, 43, 0.2); }

        /* Premium Calculator Styles */
        .calc-form label { display: block; margin: 15px 0 5px; font-size: 0.85rem; font-weight: bold; color: #888; }
        .calc-form select, .calc-form input {
            width: 100%; padding: 12px; font-size: 1rem;
            border: 1px solid var(--border-color); border-radius: 6px;
            background: #262626; color: #fff; box-sizing: border-box;
        }
        .calc-form select:focus, .calc-form input:focus { outline: none; border-color: var(--accent-blue); }
        
        .vehicles-toggle { display: none; }

        .result-box {
            margin-top: 20px; padding: 20px; 
            background: var(--result-bg); border-radius: 8px; text-align: center;
            border: 1px solid #2d3d34;
        }
        .net-premium-val { font-size: 2.5rem; font-weight: 800; color: var(--calc-highlight); }
        .breakdown-details { 
            margin-top: 15px; padding: 12px; font-size: 0.85rem; 
            background: #222; border-radius: 6px; text-align: left; line-height: 1.6; color: #aaa;
        }

        .empty-state {
            color: #555; text-align: center; padding: 40px 0; border: 1px dashed #333; border-radius: 8px;
        }
    </style>
</head>
<body>

    <header>
        <h1>THE NIKOLAI JUMP AGENCY</h1>
    </header>

    <div class="grid-container">
        
        <div class="card">
            <h3>Team Availability</h3>
            <div class="producer-row">
                <span>NIKOLAI</span>
                <button id="nikolai-btn" class="status-btn available" onclick="window.handleToggle('nikolai')">Available</button>
            </div>
            <div class="producer-row">
                <span>LESLIE</span>
                <button id="leslie-btn" class="status-btn available" onclick="window.handleToggle('leslie')">Available</button>
            </div>
        </div>

        <div class="card">
            <h3>Net Premium Calculator</h3>
            <div class="calc-form">
                <label>Policy Type</label>
                <select id="policyType" onchange="updateCalcFields()">
                    <option value="">-- Select --</option>
                    <option value="Auto">Auto</option>
                    <option value="Home">Home</option>
                    <option value="Foremost Home">Foremost Home</option>
                    <option value="Life">Life</option>
                    <option value="Specialty">Specialty</option>
                    <option value="Commercial">Commercial</option>
                </select>

                <label>Carrier</label>
                <select id="carrier" onchange="runCalculation()">
                    <option value="">-- Select --</option>
                    <option value="Farmers">Farmers</option>
                    <option value="BW">Bristol West</option>
                    <option value="Foremost">Foremost</option>
                </select>

                <label>Written Premium</label>
                <input type="number" id="writtenPremium" placeholder="0.00" step="0.01" oninput="runCalculation()">

                <div id="vehicleSection" class="vehicles-toggle">
                    <label>Number of Vehicles</label>
                    <input type="number" id="numVehicles" value="1" min="1" oninput="runCalculation()">
                </div>

                <div class="result-box" id="calcResult">
                    <div style="color: #666;">Enter details to calculate</div>
                </div>
                <div id="breakdown" class="breakdown-details" style="display:none;"></div>
            </div>
        </div>

        <div class="card">
            <h3>Agency Resources</h3>
            <div class="empty-state">
                No active links for this agency yet.
            </div>
        </div>

    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyByi38ntA4VG-oBWU5lWH-3czXDz00IAbY",
            authDomain: "jumpagency-92d18.firebaseapp.com",
            databaseURL: "https://jumpagency-92d18-default-rtdb.firebaseio.com",
            projectId: "jumpagency-92d18",
            storageBucket: "jumpagency-92d18.firebasestorage.app",
            messagingSenderId: "1020287968124",
            appId: "1:1020287968124:web:74d0e4375fddb633733af9",
            measurementId: "G-2XX866CB4V"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const statusRef = ref(db, 'agency/status');
        
        onValue(statusRef, (snapshot) => {
            const data = snapshot.val();
            updateStatusUI('nikolai-btn', data?.nikolai || 'available');
            updateStatusUI('leslie-btn', data?.leslie || 'available');
        });

        window.handleToggle = (name) => {
            const btn = document.getElementById(name + '-btn');
            const newStatus = btn.classList.contains('available') ? 'busy' : 'available';
            set(ref(db, 'agency/status/' + name), newStatus);
        };

        function updateStatusUI(id, status) {
            const btn = document.getElementById(id);
            if (!btn) return;
            if (status === 'available') {
                btn.className = 'status-btn available';
                btn.innerText = 'Available';
            } else {
                btn.className = 'status-btn unavailable';
                btn.innerText = 'Busy';
            }
        }
    </script>

    <script>
        function updateCalcFields() {
            const type = document.getElementById('policyType').value;
            const vehicleSection = document.getElementById('vehicleSection');
            vehicleSection.style.display = (type === 'Auto') ? 'block' : 'none';
            runCalculation();
        }

        function runCalculation() {
            const type = document.getElementById('policyType').value;
            const carrier = document.getElementById('carrier').value;
            const premium = parseFloat(document.getElementById('writtenPremium').value) || 0;
            const vehicles = (type === 'Auto') ? (parseFloat(document.getElementById('numVehicles').value) || 1) : 0;

            const resultDiv = document.getElementById('calcResult');
            const breakdownDiv = document.getElementById('breakdown');

            if (!type || !carrier || premium <= 0) {
                resultDiv.innerHTML = '<div style="color: #666;">Enter details to calculate</div>';
                breakdownDiv.style.display = 'none';
                return;
            }

            // Calculation Constants from Dave's Toolkit
            const addlAssessment = (type === "Auto" && carrier === "Farmers") ? vehicles * 15 : 0;
            let statutoryAssessment = 0;
            if (type === "Auto" && carrier === "BW") statutoryAssessment = vehicles * 57.12;
            else if (type === "Auto" && carrier === "Farmers") statutoryAssessment = vehicles * 14;
            
            const mccaDeficit = (type === "Auto" && carrier === "Farmers") ? vehicles * 24 : 0;

            let netPremium = premium;
            if (type === "Auto" && carrier === "Farmers") {
                netPremium = premium - addlAssessment - statutoryAssessment - mccaDeficit;
            } else if (type === "Auto" && carrier === "BW") {
                netPremium = premium - statutoryAssessment;
            }

            resultDiv.innerHTML = `
                <div class="net-premium-val">$${netPremium.toFixed(2)}</div>
                <div style="font-size: 0.8rem; color: #888; margin-top: 5px;">ESTIMATED NET PREMIUM</div>
            `;

            let details = `<strong>Breakdown:</strong><br>`;
            details += `Written: $${premium.toFixed(2)}<br>`;
            if (addlAssessment > 0) details += `<span style="color:#e74c3c">− Addl Assessment: $${addlAssessment.toFixed(2)}</span><br>`;
            if (statutoryAssessment > 0) details += `<span style="color:#e74c3c">− Stat Assessment: $${statutoryAssessment.toFixed(2)}</span><br>`;
            if (mccaDeficit > 0) details += `<span style="color:#e74c3c">− MCCA Deficit: $${mccaDeficit.toFixed(2)}</span><br>`;
            details += `<span style="color:var(--calc-highlight)"><strong>Total Net: $${netPremium.toFixed(2)}</strong></span>`;

            breakdownDiv.innerHTML = details;
            breakdownDiv.style.display = 'block';
        }
    </script>
</body>
</html>
